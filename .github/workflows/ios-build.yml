name: iOS build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for iPhone Simulator
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Dashlight.xcodeproj \
            -target Dashlight \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Launch smoke test
        run: |
          APP=build/Debug-iphonesimulator/Dashlight.app
          /usr/libexec/PlistBuddy -c Print "$APP/Info.plist" | head -40
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']))")
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" design.baquera.dashlight
          sleep 15
          if xcrun simctl spawn "$UDID" launchctl list | grep -q design.baquera.dashlight; then
            echo "App is running after 15 s"
            xcrun simctl io "$UDID" screenshot launch.png
          else
            echo "App is NOT running after 15 s"
            ls ~/Library/Logs/DiagnosticReports/ | grep -i dashlight || true
            for f in ~/Library/Logs/DiagnosticReports/Dashlight*; do head -120 "$f"; done
            xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "Dashlight"' | tail -80
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-screenshot
          path: launch.png
          if-no-files-found: ignore
